<div class="register-container">

    <div class="register-card">

        <h2>Surveyor Registration</h2>

        <div class="form-row">

            <div class="form-group">
                <label>First Name</label>
                <input
                    type="text"
                    [(ngModel)]="surveyor.firstName">
            </div>

            <div class="form-group">
                <label>Last Name</label>
                <input
                    type="text"
                    [(ngModel)]="surveyor.lastName">
            </div>

        </div>

        <div class="form-group">
            <label>Email</label>
            <input
                type="email"
                [(ngModel)]="surveyor.email">
        </div>

        <div class="form-group">
            <label>Phone Number</label>
            <input
                type="text"
                [(ngModel)]="surveyor.phoneNumber">
        </div>

        <div class="form-group">
            <label>Qualification</label>
            <input
                type="text"
                [(ngModel)]="surveyor.qualification">
        </div>

        <div class="form-row">

            <div class="form-group">
                <label>Years Of Experience</label>
                <input
                    type="number"
                    [(ngModel)]="surveyor.experienceYears">
            </div>

            <div class="form-group">
                <label>License Number</label>
                <input
                    type="text"
                    [(ngModel)]="surveyor.licenseNumber">
            </div>

        </div>

        <div class="form-group">
            <label>Address</label>
            <textarea
                [(ngModel)]="surveyor.address">
            </textarea>
        </div>

        <div class="form-row">

            <div class="form-group">
                <label>City</label>
                <input
                    type="text"
                    [(ngModel)]="surveyor.city">
            </div>

            <div class="form-group">
                <label>State</label>
                <input
                    type="text"
                    [(ngModel)]="surveyor.state">
            </div>

        </div>

        <div class="form-group">
            <label>Pincode</label>
            <input
                type="text"
                [(ngModel)]="surveyor.pincode">
        </div>

        <div class="form-row">

            <div class="form-group">
                <label>Password</label>
                <input
                    type="password"
                    [(ngModel)]="surveyor.password">
            </div>

            <div class="form-group">
                <label>Confirm Password</label>
                <input
                    type="password"
                    [(ngModel)]="surveyor.confirmPassword">
            </div>

        </div>

        <button
            class="register-btn"
            (click)="registerSurveyor()">
            Register
        </button>

    </div>

</div>
